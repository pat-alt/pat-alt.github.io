on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Configure Julia project
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.instantiate()
          '

      - name: Set up papis
        run: |
          python3 -m venv /opt/papis
          /opt/papis/bin/pip install --quiet papis
          echo "/opt/papis/bin" >> "$GITHUB_PATH"

      - name: Export bibliography
        run: |
          git clone --depth 1 https://github.com/pat-alt/bib.git "$HOME/code/bib"
          "$HOME/code/bib/setup.sh"
          mkdir -p bib
          papis export --all 'tags:peerreviewed'   --batch --format bibtex --out bib/peer.bib
          papis export --all 'tags:other'          --batch --format bibtex --out bib/other.bib
          papis export --all 'tags:preprint'       --batch --format bibtex --out bib/pre.bib
          papis export --all 'tags:sup-masters'    --batch --format bibtex --out bib/sup_masters.bib
          papis export --all 'tags:sup-bachelors'  --batch --format bibtex --out bib/sup_bachelors.bib
          papis export --all 'tags:software'       --batch --format bibtex --out bib/soft.bib

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
